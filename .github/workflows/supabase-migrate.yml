# Applies supabase/migrations to the hosted Supabase project. Started by hand
# (Actions -> "Datenbank einrichten" -> Run workflow), so it works without a local CLI.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token (Supabase dashboard -> Account -> Access Tokens)
#   SUPABASE_PROJECT_REF   project ref, the "xxxx" in https://xxxx.supabase.co
#   SUPABASE_DB_PASSWORD   database password chosen when creating the project
#   SUPABASE_DB_URL        optional: session pooler connection string, only if the linked
#                          connection fails (Dashboard -> Connect -> Session pooler)
name: Datenbank einrichten

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, welche Migrationen eingespielt würden"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Values pasted on mobile often carry spaces or line breaks; trim them, mask the trimmed
      # values and check the formats so a wrong value fails with a clear message.
      - name: Check secrets
        run: |
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          token="$(trim "$SUPABASE_ACCESS_TOKEN")"
          ref="$(trim "$SUPABASE_PROJECT_REF")"
          password="$(printf '%s' "$SUPABASE_DB_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          for value in "$token" "$ref" "$password"; do [ -n "$value" ] && echo "::add-mask::$value"; done
          failed=0
          if [ -z "$token" ]; then echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt."; failed=1
          elif [ "${token#sbp_}" = "$token" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN ist kein Supabase-Zugangstoken (muss mit sbp_ beginnen). Neues Token unter supabase.com/dashboard/account/tokens erzeugen."; failed=1
          fi
          if [ -z "$ref" ]; then echo "::error::Secret SUPABASE_PROJECT_REF fehlt."; failed=1
          elif ! printf '%s' "$ref" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error::SUPABASE_PROJECT_REF muss die 20-stellige Projekt-ID sein (Project Settings -> General -> Project ID), ohne https:// und .supabase.co."; failed=1
          fi
          if [ -z "$password" ]; then echo "::error::Secret SUPABASE_DB_PASSWORD fehlt."; failed=1; fi
          [ "$failed" = 0 ] || exit 1
          {
            echo "SUPABASE_ACCESS_TOKEN=$token"
            echo "SUPABASE_PROJECT_REF=$ref"
            echo "SUPABASE_DB_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: |
          args=""
          [ "${{ inputs.dry_run }}" = "true" ] && args="--dry-run"
          if [ -n "$SUPABASE_DB_URL" ]; then
            supabase db push --db-url "$SUPABASE_DB_URL" $args
          else
            supabase db push --linked $args
          fi

      - name: Show applied migrations
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            supabase migration list --db-url "$SUPABASE_DB_URL"
          else
            supabase migration list --linked
          fi

      # Rule 3 in CLAUDE.md: types must match the schema. The generated file is attached to the
      # run; a difference only produces a warning, the database is already migrated.
      - name: Compare generated types
        if: ${{ !inputs.dry_run }}
        run: |
          supabase gen types typescript --linked > database.types.ts
          if diff -q database.types.ts src/lib/supabase/database.types.ts > /dev/null; then
            echo "Typen sind aktuell."
          else
            echo "::warning::Die generierten Typen weichen von src/lib/supabase/database.types.ts ab. Datei aus den Artefakten dieses Laufs übernehmen."
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry_run }}
        with:
          name: database-types
          path: database.types.ts
          retention-days: 7
